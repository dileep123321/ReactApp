name: React Lint and Trivy Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint React Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm ci
          npm install --save-dev eslint eslint-plugin-react

      - name: Detect React source folder
        id: detect
        run: |
          if [ -d "src" ]; then
            echo "SRC_DIR=src" >> $GITHUB_ENV
          elif [ -d "frontendapp" ]; then
            echo "SRC_DIR=frontendapp" >> $GITHUB_ENV
          else
            echo "SRC_DIR=." >> $GITHUB_ENV
          fi
          echo "React source folder: $SRC_DIR"

      - name: Ensure ESLint config exists
        run: |
          if [ ! -f ".eslintrc.js" ]; then
            cat > .eslintrc.js <<'EOF'
module.exports = {
  env: { browser: true, es2021: true },
  extends: ['eslint:recommended', 'plugin:react/recommended'],
  parserOptions: { ecmaFeatures: { jsx: true }, ecmaVersion: 12, sourceType: 'module' },
  plugins: ['react'],
  rules: { 'no-unused-vars': 'warn', 'no-console': 'off', 'semi': ['error', 'always'] }
};
EOF
          fi

      - name: Run ESLint (warnings won’t fail workflow)
        run: npx eslint $SRC_DIR --ext .js,.jsx,.ts,.tsx || true

  trivy-scan:
    name: Scan Docker Image with Trivy
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t reactapp:latest .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: reactapp:latest
          format: json
          output: trivy-report.json
          exit-code: 0
          ignore-unfixed: true

      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.json

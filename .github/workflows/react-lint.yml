name: React Lint and Trivy Scan

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Lint React Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          npm ci || npm install
          npm install --save-dev eslint eslint-plugin-react

      - name: Detect React source folder
        id: detect
        run: |
          if [ -d "src" ]; then
            echo "SRC_DIR=src" >> $GITHUB_ENV
          elif [ -d "frontendapp" ]; then
            echo "SRC_DIR=frontendapp" >> $GITHUB_ENV
          else
            echo "SRC_DIR=." >> $GITHUB_ENV
          fi
          echo "React source folder: $SRC_DIR"

      - name: Ensure ESLint config exists
        run: |
          if [ ! -f ".eslintrc.js" ]; then
            cat > .eslintrc.js <<'EOF'
module.exports = {
  env: { browser: true, es2021: true },
  extends: ['eslint:recommended', 'plugin:react/recommended'],
  parserOptions: {
    ecmaFeatures: { jsx: true },
    ecmaVersion: 12,
    sourceType: 'module'
  },
  plugins: ['react'],
  rules: {
    'no-unused-vars': 'warn',
    'no-console': 'off',
    'semi': ['error', 'always']
  }
};
EOF
          fi

      - name: Run ESLint
        run: npx eslint $SRC_DIR --ext .js,.jsx,.ts,.tsx || true

  trivy-scan:
    name: Scan Docker Image with Trivy
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Docker availability
        run: docker --version

      - name: Build Docker image
        run: docker build -t reactapp:latest .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: reactapp:latest
          format: json
          output: trivy-report.json
          exit-code: 0
          ignore-unfixed: true

      - name: Convert Trivy JSON report to HTML
        run: |
          echo "<html><body><pre>" > trivy-report.html
          cat trivy-report.json | jq '.' >> trivy-report.html
          echo "</pre></body></html>" >> trivy-report.html

      - name: Upload Trivy reports
        uses: actions/upload-artifact@v4
        with:
          name: trivy-reports
          path: |
            trivy-report.json
            trivy-report.html
